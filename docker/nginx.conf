server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Container-level liveness endpoint. Backend health endpoints remain
    # directly available from the backend host; public API routes use /api/v1.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Keep the /api prefix intact: the ASP.NET Core API owns API versioning and
    # routing (for example, /api/v1/*).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Vite produces a single-page application: client-side paths fall back to
    # index.html while existing static assets keep their normal cache behavior.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
